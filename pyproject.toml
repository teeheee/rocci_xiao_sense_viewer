[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocci-xiao-sense-viewer"
version = "0.1.0"
description = "Serial protocol parser and PySide6 viewer for the rocci xiao sense camera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "numpy>=1.26",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
rocci-viewer = "rocci_xiao_sense_viewer.app:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["rocci_xiao_sense_viewer*"]
